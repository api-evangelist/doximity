aid: doximity
name: Doximity
description: 'Doximity is the leading digital platform for U.S. medical professionals, used by
  the majority of physicians and a large share of nurse practitioners and physician assistants. Its
  public developer surface is an OAuth 2.0 and OpenID Connect identity API hosted at auth.doximity.com
  that lets third-party applications verify and identify Doximity members against the Doximity medical
  database, request a curated set of profile claims (name, credentials, specialty, email, office, and
  more), and reduce registration friction. Doximity also ships the Doximity Dialer SDKs for iOS and
  Android so partner apps can place HIPAA-secure calls that mask the caller''s personal number, plus a
  Share Button and Registration integration. Authentication uses the Authorization Code grant with
  mandatory PKCE, refresh tokens, and device_code, and the platform is SOC 2 Type 2 and HIPAA/HITECH
  certified. This profile was enriched by the API Evangelist pipeline from Doximity''s public developer
  documentation and OpenID Connect discovery metadata.'
